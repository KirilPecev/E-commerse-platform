services:
  k6:
    image: grafana/k6:latest
    container_name: ecommerce-k6
    volumes:
      - ./ECommercePlatform.Tests/Load:/tests:ro
    working_dir: /tests
    environment:
      - PRODUCT_SERVICE_URL=${PRODUCT_SERVICE_URL:-http://host.docker.internal:5002}
      - ORDER_SERVICE_URL=${ORDER_SERVICE_URL:-http://host.docker.internal:5004}
      - INVENTORY_SERVICE_URL=${INVENTORY_SERVICE_URL:-http://host.docker.internal:5003}
      - PAYMENT_SERVICE_URL=${PAYMENT_SERVICE_URL:-http://host.docker.internal:5005}
      - IDENTITY_SERVICE_URL=${IDENTITY_SERVICE_URL:-http://host.docker.internal:5001}
      - K6_VUS=${K6_VUS:-50}
      - K6_DURATION=${K6_DURATION:-1m}
      - K6_SCRIPT=${K6_SCRIPT:-product-load-test.js}
    command: run --vus ${K6_VUS:-50} --duration ${K6_DURATION:-1m} ${K6_SCRIPT:-product-load-test.js}